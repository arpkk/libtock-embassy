[package]
name = "libtock-embassy"
version = "0.1.0"
edition = "2024"

[dependencies]
libtock = {git = "https://www.github.com/tock/libtock-rs", rev = "0766d8cf65b21f01e3340e4b37b345b177a4fb55" }
libtock_runtime = {git = "https://www.github.com/tock/libtock-rs", rev = "0766d8cf65b21f01e3340e4b37b345b177a4fb55" }
libtock_debug_panic = {git = "https://www.github.com/tock/libtock-rs", rev = "0766d8cf65b21f01e3340e4b37b345b177a4fb55" }
libtock_console = {git = "https://www.github.com/tock/libtock-rs", rev = "0766d8cf65b21f01e3340e4b37b345b177a4fb55" }
libtock_leds = {git = "https://www.github.com/tock/libtock-rs", rev = "0766d8cf65b21f01e3340e4b37b345b177a4fb55" }
libtock_platform = {git = "https://www.github.com/tock/libtock-rs", rev = "0766d8cf65b21f01e3340e4b37b345b177a4fb55" }

# Sin `platform-*`: ese grupo de features hace que embassy-executor defina su
# propio `__pender` (WFE/SEV en Cortex-M). Acá el pender lo definimos nosotros
# sobre `yield`, así que el módulo `platform` tiene que quedar apagado.
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = "0.1"
# tick-hz: la cápsula de alarma de Tock devuelve los ticks "left-justified" a
# 32 bits, así que la frecuencia que ve userspace es la del RTC escalada.
# nRF52840: RTC de 24 bits a 32768 Hz -> 32768 << (32-24) = 8_388_608 Hz.
embassy-time = { version = "0.5", features = ["tick-hz-8_388_608"] }
embassy-time-driver = "0.2"
# Sin `generic-queue-*`: usamos la cola integrada, que guarda el nodo dentro de
# cada tarea de embassy-executor (sin heap, sin capacidad fija).
embassy-time-queue-utils = { version = "0.3", features = ["integrated-timers"] }
critical-section = "1.1"
static_cell = "2"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }

[build-dependencies]
libtock_build_scripts = {git = "https://www.github.com/tock/libtock-rs", rev = "0766d8cf65b21f01e3340e4b37b345b177a4fb55" }
